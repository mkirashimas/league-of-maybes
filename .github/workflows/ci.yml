name: ci

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            functions/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      # Cloud Functions: own package, own lint and build.
      - run: yarn install --frozen-lockfile
        working-directory: functions
      - run: yarn lint
        working-directory: functions
      - run: yarn build
        working-directory: functions

  # Security rule tests against the Firestore emulator (needs Java and the Firebase CLI).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn global add firebase-tools
      - run: echo "$(yarn global bin)" >> "$GITHUB_PATH"
      - run: yarn test:rules
