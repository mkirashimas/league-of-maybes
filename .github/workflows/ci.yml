name: ci

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            functions/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      # Cloud Functions: own package, own lint and build.
      - run: yarn install --frozen-lockfile
        working-directory: functions
      - run: yarn lint
        working-directory: functions
      - run: yarn build
        working-directory: functions
